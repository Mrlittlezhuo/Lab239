# 模型配置项


# 默认选用的 LLM 名称。
# 2026-10-10 切到本机 Strata 网关（127.0.0.1:8081，见 MODEL_PLATFORMS/strata）：
# strata 引擎把两张卡的显存吃满（GPU0 剩 175MiB、GPU1 剩 343MiB），ollama 的
# qwen2:7b 在 llama_init_from_model 阶段 cudaMalloc 失败，LLM 全线 500。改接
# 已经在跑的网关不再新增显存占用。实测：/v1/models 正常、stream=true 正常、
# tools 函数调用返回合法 tool_calls。
# Embedding 仍走 ollama 的 bge-m3：它只有 1.2GB 还能加载，且 strata 是生成模型、
# 不提供嵌入。
DEFAULT_LLM_MODEL: qwen3.8-flash-next-iq3_s

# 默认选用的 Embedding 名称
DEFAULT_EMBEDDING_MODEL: bge-m3

# AgentLM模型的名称 (可以不指定，指定之后就锁定进入Agent之后的Chain的模型，不指定就是 DEFAULT_LLM_MODEL)
Agent_MODEL: ''

# 默认历史对话轮数
HISTORY_LEN: 3

# 大模型最长支持的长度，如果不填写，则使用模型默认的最大长度，如果填写，则为用户设定的最大长度
MAX_TOKENS:

# LLM通用对话参数
TEMPERATURE: 0.7

# 自动模式（extra.auto_agent）意图路由 provider：llm / fastjev。
# 2026-10-08 回归并切回 fastjev：本机 FastJev 服务（127.0.0.1:8811，GPU1，
# llama-cpp backend）+ 两项代码修复（超时 8→12s；工具头提升规则 + 工具头置信度
# 托底）后，31 条对比基准 fastjev 31/31（联网搜索 5/5 命中，无误报），优于
# llm 29/31。此前 fastjev 把"联网搜索X"判成 general 的系统性误判已被工具头
# 提升/托底规则修复。若后续 FastJev 服务不可用，会自动回退 llm 路由。
AUTO_ROUTE_PROVIDER: fastjev

# 支持的Agent模型
SUPPORT_AGENT_MODELS:
  - qwen3.8-flash-next-iq3_s
  - qwen2:7b
  - chatglm3-6b
  - glm-4
  - openai-api
  - Qwen-2
  - qwen2-instruct
  - gpt-3.5-turbo
  - gpt-4o

# LLM模型配置，包括了不同模态初始化参数。
# `model` 如果留空则自动使用 DEFAULT_LLM_MODEL
LLM_MODEL_CONFIG:
  preprocess_model:
    model: ''
    temperature: 0.05
    max_tokens: 4096
    history_len: 10
    prompt_name: default
    callbacks: false
  llm_model:
    model: ''
    temperature: 0.9
    max_tokens: 4096
    history_len: 10
    prompt_name: default
    callbacks: true
  action_model:
    model: ''
    temperature: 0.01
    max_tokens: 4096
    history_len: 10
    prompt_name: ChatGLM3
    callbacks: true
  postprocess_model:
    model: ''
    temperature: 0.01
    max_tokens: 4096
    history_len: 10
    prompt_name: default
    callbacks: true
  image_model:
    model: sd-turbo
    size: 256*256

# # 模型加载平台配置


# # 平台名称
# platform_name: xinference

# # 平台类型
# # 可选值：['xinference', 'ollama', 'oneapi', 'fastchat', 'openai', 'custom openai']
# platform_type: xinference

# # openai api url
# api_base_url: http://127.0.0.1:9997/v1

# # api key if available
# api_key: EMPTY

# # API 代理
# api_proxy: ''

# # 该平台单模型最大并发数
# api_concurrencies: 5

# # 是否自动获取平台可用模型列表。设为 True 时下方不同模型类型可自动检测
# auto_detect_model: false

# # 该平台支持的大语言模型列表，auto_detect_model 设为 True 时自动检测
# llm_models: []

# # 该平台支持的嵌入模型列表，auto_detect_model 设为 True 时自动检测
# embed_models: []

# # 该平台支持的图像生成模型列表，auto_detect_model 设为 True 时自动检测
# text2image_models: []

# # 该平台支持的多模态模型列表，auto_detect_model 设为 True 时自动检测
# image2text_models: []

# # 该平台支持的重排模型列表，auto_detect_model 设为 True 时自动检测
# rerank_models: []

# # 该平台支持的 STT 模型列表，auto_detect_model 设为 True 时自动检测
# speech2text_models: []

# # 该平台支持的 TTS 模型列表，auto_detect_model 设为 True 时自动检测
# text2speech_models: []
MODEL_PLATFORMS:
  # 本机 Strata 网关（serve/server.py --port 8081），OpenAI 兼容。
  # api_key 写成 `${VAR}` 引用：本文件随仓库版本控制，密钥只存在于运行环境
  # （conda env config vars set STRATA_API_KEY=… -n Langchain-Chatchat）。
  # 变量未设置时服务仍能启动，启动信息会点名是哪个平台缺哪个变量。
  - platform_name: strata
    platform_type: openai
    api_base_url: http://127.0.0.1:8081/v1
    api_key: ${STRATA_API_KEY}
    api_proxy: ''
    api_concurrencies: 5
    auto_detect_model: false
    llm_models:
      - qwen3.8-flash-next-iq3_s
    embed_models: []
    text2image_models: []
    image2text_models: []
    rerank_models: []
    speech2text_models: []
    text2speech_models: []
  - platform_name: xinference
    platform_type: xinference
    api_base_url: http://127.0.0.1:9997/v1
    api_key: EMPTY
    api_proxy: ''
    api_concurrencies: 5
    auto_detect_model: false
    llm_models: []
    embed_models: []
