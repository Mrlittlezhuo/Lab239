[tool.poetry]
name = "langchain-chatchat"
version = "0.3.1.3"
description = "Langchain-Chatchat (formerly langchain-ChatGLM), local knowledge based LLM (like ChatGLM, Qwen and Llama) RAG and Agent app with langchain"
authors = ["chatchat"]
readme = "README.md"
packages = [
    {include = "chatchat"},
    {include = "langchain_chatchat"}
]

[tool.poetry.scripts]
chatchat = 'chatchat.cli:main'

[tool.poetry.dependencies]
python = ">=3.10,<3.12,!=3.9.7"
# 任务013：LangChain 1.x / LangGraph 1.x 迁移基线（已安装并验证的稳定版）
langchain = "1.4.3"
langchain-core = "1.6.7"
langchain-classic = "1.0.8"
langchain-community = "0.4.2"
langchain-openai = "1.6.7"
langchain-experimental = "0.4.2"
langchain-text-splitters = "1.1.3"
langgraph = "1.2.14"
# 3.1.1 有 1 条 MODERATE advisory（GHSA-6hmw-9432-67qq，修复自 3.1.2），抬到 <3.2 内区间。
# tests/unit_tests/test_langgraph_compat.py 直接 import SqliteSaver 并记录了 3.1.1 的行为
# 特性，该文件在实装的 3.1.3 下通过；research/agent 两条运行时链路也覆盖 checkpoint。
langgraph-checkpoint-sqlite = ">=3.1.2,<3.2"
# 任务014：AsyncSqliteSaver 所需的异步 SQLite 驱动（生产 Agent 运行 checkpoint 持久化）
aiosqlite = "^0.22"
# 任务016：Phoenix 本地可观测性（默认关闭；phoenix serve 提供本地 UI/collector）。
# 12.6.1 是与既有 fastapi 0.109.2 / starlette 0.36.3 / pydantic 2.11.10 钉版
# 相容的最新稳定版（更高版本要求升级 fastapi，违反任务边界）。
arize-phoenix = "12.6.1"
arize-phoenix-otel = "0.17.1"
openinference-instrumentation-langchain = "0.1.78"
# 兼容性钉版：arize-phoenix 12.6.1 需要 phoenix.evals.models（evals 3.x 已移除）；
# strawberry-graphql 0.270.1 与 graphql-core 3.3+ 不兼容（ExecutionContext 移除）
arize-phoenix-evals = "2.13.0"
graphql-core = ">=3.2.12,<3.3"  # 3.2.7 有 2 条 HIGH（修复自 3.2.12）；上界仍守 3.3，理由见上一行
# 兼容性钉版：arize-phoenix 12.6.1 不约束 pyarrow，pip 会解析到 21+，而那些 wheel 是按
# NumPy 2.x 编译的，与本文件 `numpy = ">=1.26,<2"` 直接冲突。后果不是「可观测性不能用」
# 而是「测试全跑不了」：arize-phoenix 注册了 pytest11 插件（phoenix.client.pytest.plugin），
# pytest 启动即 import phoenix → import pyarrow → ImportError，整个会话无法收集。
# 18.x 是仍按 NumPy 1.x 构建的最后一支（18.1.0 实测与 numpy 1.26.4 共存、1422 个测试可收集）。
pyarrow = ">=18.1.0,<19"
# 兼容性钉版：protobuf 必须留在 4.x —— streamlit 1.34.0 要 `protobuf<5`，
# onnxruntime 与 arize-phoenix 要 `>=4.25.8`，交集就是 >=4.25.8,<5。
# 而 googleapis-common-protos 1.75+ 要求 `protobuf>=6.33.5`，与 streamlit 不可同时满足；
# 它生成的 pb2 代码 `from google.protobuf import runtime_version`，protobuf 4.x 没有该模块，
# 于是 phoenix.otel 导入即失败（tests/unit_tests/test_observability.py 6 个用例）。
# 1.62.0 是仍按 protobuf 4.x 生成的最后一支（实测 phoenix.otel 导入通过、6 个用例转绿）。
protobuf = ">=4.25.8,<5"
googleapis-common-protos = "1.62.0"
openai = ">=3,<4"
humanlayer= "0.7.6"
nest_asyncio = "1.6.0"
# 1.30.0 是 1.x 最后一版：带来 streamable HTTP 客户端、ClientSession 的 list_roots 回调
# 和 2025-11-25 协议，且 mcp_kit 现在 import 的符号全部还在。
# 2.x 把 mcp.server.fastmcp 整体改名成 mcp.server.mcpserver，mcp_kit/tools.py 里
# `from mcp.server.fastmcp.utilities.func_metadata import ArgModelBase` 会直接 ImportError，
# 所以升 2.x 之前必须先改 mcp_kit。
mcp = ">=1.30.0,<2"
fastapi = "~0.109.2"
sse_starlette = "~1.8.2"
# OSV 复算：3.8.1 命中 89 条 advisory / 46 个 CVE（含 CRITICAL，修复自 3.10）。
# `~3.8.1` 等于只允许 3.8.x，正好停在有 CRITICAL 的那一支。抬到 >=3.10,<4。
# 覆盖面：`chatchat/settings.py` 顶层就 `import nltk` 并追加 NLTK_DATA_PATH，
# 所以每次跑测试都会经过它；要求方只有 unstructured 0.11.8，且对 nltk 不加版本约束。
nltk = ">=3.10,<4"
uvicorn = ">=0.27.0.post1"
unstructured = "~0.11.0"
python-magic-bin = {version = "*", platform = "win32"}
SQLAlchemy = "~2.0.25"
faiss-cpu = "~1.7.4"
jieba = "0.42.1"
rank_bm25 = "0.2.2"
openpyxl = "3.1.4"
networkx = "3.1"
opencv-python = "~4.10.0.84"
PyMuPDF = "~1.23.16"
# 声明 `~1.3.8`（= >=1.3.8,<1.4.0），实装是 1.4.4 —— 又一个声明与现实不符，且这条是
# 真被代码用着：chatchat/server/file_rag/document_loaders/mydocloader.py 的
# RapidOCRDocLoader 里 `from rapidocr_onnxruntime import RapidOCR`。
# 改成 `~1.4.4` 对齐实装。最小实测：`RapidOCR()` 在 1.4.4 下能正常实例化（模型随 wheel
# 分发，加载成功）。残余风险如实写明：**OCR 解析路径没有任何自动化测试覆盖**，
# 这条只是把版本区间对齐到真实使用的那一支，不代表 1.4.4 的 OCR 结果经过验证。
rapidocr_onnxruntime = "~1.4.4"
# requests 的钉版依据是逐条复算：2.32.3 命中 CVE-2024-47081（恶意 URL 让 .netrc 凭据
# 外泄，2.32.4 修复），且 langchain-community 0.4.2 要求 requests>=2.32.5（pip check
# 一直报这条冲突）；但停在 2.32.5 仍剩 2 条 MODERATE（GHSA-gc5v-m9x4-r6x2、
# PYSEC-2026-2275），它们的修复版本是 2.33.0，不跨 minor 就关不掉。
# 跨 minor 的前提是实测：升级前后 pip freeze 逐行 diff 只有 requests 一行变化；
# 要求方 langchain-community 的约束是 `requests<3.0.0,>=2.32.5`；responses 0.26.3 与
# requests-mock 1.12.1 相关的出站请求用例全绿。
requests = "~2.33.0"
pathlib = "~1.0.1"
# mcp 1.30.0 要求 pyjwt[crypto]>=2.10.1；登录令牌签发处已跑过回归（tests/api/test_auth.py）
pyjwt = ">=2.10.1,<3"
elasticsearch = "*"
numexpr = ">=1" #test
strsimpy = ">=0.2.1"
markdownify = ">=0.11.6"
tqdm = ">=4.66.1"
websockets = ">=12.0"
numpy = ">=1.26,<2"
# pandas 原先钉 `~1.3.0`（只允许 1.3.x），这个约束在本机环境里早就失效：实际装的是
# pandas 2.3.3 + numpy 1.26.4，全套测试也一直是绿。而且 1.3.x 与上面的 numpy>=1.26
# 无法同时成立（pandas 1.3 没有对 numpy 1.26 构建的轮子），新机器照抄这份依赖会装不上。
# 下限取 2.1：那是第一个同时提供 cp311 轮子并支持 numpy 1.26 的版本。上限 <3 与主要
# 消费方一致（streamlit 1.34.0 要 pandas<3,>=1.3.0；altair 4.2.2 要 >=0.18；
# streamlit-aggrid 1.0.5 要 >=1.2，都不排斥 2.x）。
# 本仓库唯一的 pandas 用法在 chatchat/webui_pages/knowledge_base/knowledge_base.py：
# 构造 DataFrame、取列、`.any()`，没有用到 2.0 移除的 `DataFrame.append` /
# `Series.append` / `pd.np` / `.ix[]` / `iteritems` / `get_values`（已 grep 验证）。
pandas = ">=2.1,<3" # test
pydantic = "~2.11.1"
httpx = {version = "0.27.2", extras = ["brotli", "http2", "socks"]}
# python-multipart 原先钉死 `0.0.9`，OSV 复算出 16 条 advisory / 8 个 CVE（多条 HIGH，
# 修复自 0.0.18 起）。放宽到 `>=0.0.18,<0.1`：这个包在 0.0.12+ 把导入名换成了
# python_multipart，而 fastapi 0.109.2 走的仍是旧路径 `from multipart.multipart
# import parse_options_header`，所以必须实测。已实测 0.0.33 下旧导入仍然可用
# （compat shim 还在）、app 266 条路由正常构建、TestClient 正常。
python-multipart = ">=0.0.18,<0.1"
json_repair = ">=0.30.0"
# webui
streamlit = "1.34.0"
streamlit-option-menu = "0.3.12"
streamlit-antd-components = "0.3.1"
streamlit-chatbox = "1.1.12.post4"
streamlit-modal = "0.1.0"
streamlit-aggrid = "1.0.5"
streamlit-extras = "0.4.2"
extra-streamlit-components = "0.1.71"
htbuilder = "0.6.2"
xinference_client = { version = "^0.13.0", optional = true }
zhipuai = { version = "^2.1.0", optional = true }
pymysql = "^1.1.0"
memoization = "0.4.0"
pydantic_settings = ">=2.3.4"
ruamel_yaml = "0.18.6"
loguru = "^0.7.2"
streamlit-paste-button = "0.1.2"
python-docx = "1.1.2"
# 聊天工具依赖：这些包缺失时工具会在调用期 ImportError，接口层只剩
# "failed to call tool 'x'"，从注册表上完全看不出来（见 server/agent/tools_access.py）。
# arxiv 必须 <3：langchain_community 的 ArxivAPIWrapper 调 arxiv.Search(...).results()，
# arxiv 3/4 改成了 arxiv.Client().results(search)，装上 4.x 该工具必然失败。
arxiv = ">=2.1,<3"
wikipedia = "^1.4"
youtube-search = "^2.2"
wolframalpha = "^5.0"

