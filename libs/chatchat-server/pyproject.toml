[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
# The only dependencies that should be added are
# dependencies used for running tests (e.g., pytest, freezegun, response).
# Any dependencies that do not meet that criteria will be removed.
# pytest 7.4.4（本机实装）命中 2 条 advisory（含 PYSEC-2026-1845），修复版本 9.0.3。
# 抬到 9 会牵动测试插件链，见下面 pytest-asyncio 与 syrupy 两条注释；这三处必须一起改，
# 单改 pytest 就是拿依赖冲突换一个安全补丁。实测：1433 passed / exit 0 / 18:54。
pytest = ">=9.0.3,<10"
# pytest-cov 声明 `^4.0.0`（poetry 语义 = >=4,<5），实装却是 7.1.0，声明出界两个大版本。
# 实测 pytest-cov 7.1.0 在 pytest 9.2.0 下可用：--cov=chatchat.settings 跑
# test_api_contract 得 11 passed。它也由 arize-phoenix 作为传递依赖带进来。
pytest-cov = ">=7,<8"
# 以下三条是"声明与现实不符"的清理，逐条给证据：
# 1) pytest-dotenv 删除：全仓库没有任何 `--envfile` 用法，[tool.pytest.ini_options] 里
#    也没有 envfile 配置，测试代码 0 处引用。注意不要和文件末尾的
#    [tool.poetry.plugins.dotenv] 混为一谈 —— 那是另一件事，本轮没有动（见那里的说明）。
# 2) duckdb-engine 删除：test 组里声明但环境里没装，测试 0 处使用；settings.py 里的
#    duckdb 只是注释中列举 SQLAlchemy 方言（chatchat/settings.py:642），不是代码路径。
#    真要启用 DuckDB 向量库是运行时功能决定，应当显式声明 duckdb + duckdb-engine，
#    不该以"测试依赖"的名义混在这里。
# 3) responses 删除：测试里 0 处使用（grep `import responses` 与 `@responses` 全空），
#    它实际是被 smart_open 8.0.3 作为传递依赖带进来的；而我们的 `^0.22.0`（= <0.23）
#    与实装的 0.26.3 直接冲突 —— 这条声明不但过时，还会和传递依赖打架。
# 保留并补装的是 pytest-watcher：Makefile 的 test_watch / test_watch_extended 直接调用
# ptw，所以声明是真实的，缺的是安装。本轮把现实补齐，而不是删掉真实需求。
# 声明 `^0.2.6`（= >=0.2.6,<0.3.0），实装 0.6.3，声明出界；而 Makefile 的 test_watch
# 确实需要它，所以是"补装 + 对齐版本区间"，不是删声明。实测 0.6.3：
# `python -m pytest_watcher --help` 正常，`--now` 能带 pytest 跑起来后进入监视。
pytest-watcher = ">=0.6.3,<0.7"
freezegun = "^1.2.2"
# pytest-asyncio 0.23.8（本机实装）自己的 requires_dist 写的是 `pytest<9,>=7.0.0`，
# 也就是它自己划的上界正好卡在 pytest 9 之前 —— 抬 pytest 必须同时抬它，不是我的推测。
# 实测 1.4.1：异步用例集中的 test_agent_runtime_langgraph / test_agent_run_answer_stream
# 等文件全绿。
pytest-asyncio = ">=1,<2"
lark = "^1.1.5"
pytest-mock = "^3.10.0"
# 测试期间的网络封锁依赖。原先钉 `^0.6.0`（poetry 语义 = >=0.6.0,<0.7.0），但本机实装
# 0.8.1，声明与现实不符。下限取 0.7 是因为 Makefile 现在用的 `--allow-hosts` 口径是在
# 实装的 0.8.1 上验证的（0.6 没有实测过，只是不把区间收到把实装版本排除掉的程度）。
pytest-socket = ">=0.7.0,<0.9"
# syrupy 4.9.1 的 requires_dist 是 `pytest<9.0.0,>=7.0.0`，是抬 pytest 的硬拦路虎。
# 它看起来"没用"其实承重方式很隐蔽：AST 扫全部 tests 确认 **0 个用例使用 snapshot
# fixture**（14 个文件里的 "snapshot" 都是契约领域命名，如 check_snapshot），但
# 本文件 [tool.pytest.ini_options] 的 addopts 带了 `--snapshot-warn-unused`，而 pytest
# 又开了 `--strict-config` —— syrupy 不在场，pytest 启动阶段就因未知开关失败。
# 所以本轮选择升到 5.x 保留它（实测 5.5.3 下该开关仍被接受、全量绿），而不是删。
# 若将来要删 syrupy，必须同时改 addopts，那是另一笔决定。
syrupy = ">=5,<6"
requests-mock = "^1.11.0"


[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.1.5"


[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.0"


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
setuptools = "^67.6.1"



[tool.ruff]
exclude = [
    "tests/examples/non-utf8-encoding.py",
    "tests/integration_tests/examples/non-utf8-encoding.py",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "T201", # print
]

[tool.mypy]
ignore_missing_imports = "True"
disallow_untyped_defs = "True"
exclude = ["notebooks", "examples", "example_data"]

[tool.coverage.run]
omit = [
    "tests/*",
]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-plugin-pypi-mirror==0.4.2"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# --strict-markers will raise errors on unknown marks.
# https://docs.pytest.org/en/7.1.x/how-to/mark.html#raising-errors-on-unknown-marks
#
# https://docs.pytest.org/en/7.1.x/reference/reference.html
# --strict-config       any warnings encountered while parsing the `pytest`
#                       section of the configuration file raise errors.
#
# https://github.com/tophat/syrupy
# --snapshot-warn-unused    Prints a warning on unused snapshots rather than fail the test suite.
addopts = "--strict-markers --strict-config --durations=5 --snapshot-warn-unused -svv"
# Registering custom markers.
# https://docs.pytest.org/en/7.1.x/example/markers.html#registering-markers
markers = [
    "requires: mark tests as requiring a specific library",
    "scheduled: mark tests to run in scheduled testing",
    "compile: mark placeholder test used to compile integration tests without running them"
]
asyncio_mode = "auto"


[tool.codespell]
skip = '.git,*.pdf,*.svg,*.pdf,*.yaml,*.ipynb,poetry.lock,*.min.js,*.css,package-lock.json,example_data,_dist,examples,*.trig,*.json,*.md,*.html,*.txt,*.csv'
# Ignore latin etc
ignore-regex = '.*(Stati Uniti|Tense=Pres).*'
# whats is a typo but used frequently in queries so kept as is
# aapply - async apply
# unsecure - typo but part of API, decided to not bother for now
ignore-words-list = 'momento,collison,ned,foor,reworkd,parth,whats,aapply,mysogyny,unsecure,damon,crate,aadd,symbl,precesses,accademia,nin'

# 可疑的历史遗留声明，本轮只标注、未改动。理由：这里声明 langchain-chatchat 自身提供
# 一个 poetry 插件入口 `dotenv:plugin`，但本发行包里并没有名为 `dotenv` 的模块
# （环境里装的是 python-dotenv 1.2.4，那是另一个包；名为 dotenv 的发行包未安装）。
# 而本机没有 poetry，这条声明的实际后果无法定向验证 —— 按"没有验证就不改"的规矩留着。
[tool.poetry.plugins.dotenv]
ignore = "false"
dotenv = "dotenv:plugin"


# https://python-poetry.org/docs/repositories/
[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"
